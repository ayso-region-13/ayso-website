# NOTE: Pages CMS has no top-level `branch:` setting — it edits whichever
# branch is selected in the UI, defaulting to the repo's GitHub default
# branch. We set the GitHub default branch to `staging` (2026-06-08) so the
# CMS always opens on staging. Do NOT rely on a `branch:` key here; it is
# silently ignored.

media:
  # Two buckets so editors can upload images AND PDFs through the CMS.
  # Image fields and the rich-text editor's "insert image" button use
  # the `images` bucket; the rich-text editor's "insert link" upload
  # and any explicit type:file fields use the `docs` bucket.
  - name: images
    label: Images
    input: site/src/images
    output: /images
    extensions: [jpg, jpeg, png, gif, webp, svg]
  - name: docs
    label: Documents (PDFs)
    input: site/src/assets/docs
    output: /assets/docs
    extensions: [pdf]

content:

  # ── Site-wide settings ────────────────────────────────────────────────────

  - name: fieldstatus
    label: Field Status
    type: file
    path: site/src/_data/fieldstatus.json
    fields:
      - name: enabled
        label: "Show field status widget on home page"
        type: boolean
      - name: status
        label: "Status"
        type: string
        description: "Enter exactly: Open, Closed, or Monitoring"
      - name: message
        label: "Message"
        type: string
        description: "Details shown after the status. E.g. 'All fields open' or 'Upper fields closed due to rain.'"

  - name: announcements
    label: Announcement Bar
    type: file
    path: site/src/_data/announcements.json
    fields:
      - name: enabled
        label: "Show announcement bar on home page"
        type: boolean
      - name: body
        label: "Announcement text"
        type: rich-text
        description: "Supports bold, links, and multiple sentences. Links open inline — no separate URL field needed."

  - name: importantDates
    label: Important Dates
    type: file
    path: site/src/_data/importantDates.json
    fields:
      - name: enabled
        label: "Show Important Dates widget on home page"
        type: boolean
      - name: dates
        label: "Dates"
        type: object
        list:
          min: 0
          max: 20
        description: "List as many as you like — the home page shows the next 3 upcoming events. Past events are hidden automatically."
        fields:
          - { name: date, label: "Date",             type: date }
          - { name: name, label: "Event Name",       type: string }
          - { name: link, label: "Link (optional)",  type: string, required: false, description: "Internal path (e.g. /programs/fall-soccer/) or full external URL." }

  # ── Single pages ─────────────────────────────────────────────────────────

  - name: home
    label: Home Page
    type: file
    path: site/src/index.md
    fields:
      - { name: title,       label: "Page Title",        type: string }
      - { name: description, label: "Meta Description",  type: string }
      - { name: layout,      label: Layout,              type: string, hidden: true }
      - { name: section,     label: Section,             type: string, hidden: true }
      - { name: body,        label: Content,             type: rich-text }

  # ── Collections ──────────────────────────────────────────────────────────

  - name: about
    label: About Region 13
    type: collection
    path: site/src/about
    fields: &page-fields
      - { name: title,        label: "Page Title",        type: string }
      - { name: description,  label: "Meta Description",  type: string }
      - { name: layout,       label: Layout,              type: string, hidden: true }
      - { name: section,      label: Section,             type: string, hidden: true }
      - { name: permalink,    label: Permalink,           type: string, hidden: true, required: false }
      - name: heroImage
        label: "Hero Image"
        type: image
        media: images
        required: false
      - { name: heroImageAlt, label: "Hero Image Alt Text", type: string, required: false }
      - { name: body,         label: Content,               type: rich-text }

  - name: programs
    label: Programs
    type: collection
    path: site/src/programs
    fields: &program-fields
      - { name: title,        label: "Page Title",        type: string }
      - { name: description,  label: "Meta Description",  type: string }
      - { name: layout,       label: Layout,              type: string, hidden: true }
      - { name: section,      label: Section,             type: string, hidden: true }
      - { name: permalink,    label: Permalink,           type: string, hidden: true, required: false }
      - name: heroImage
        label: "Hero Image"
        type: image
        media: images
        required: false
      - { name: heroImageAlt, label: "Hero Image Alt Text", type: string, required: false }
      - { name: eventName,      label: "Event name (for schema)",      type: string, required: false, description: "Optional. Used in JSON-LD SportsEvent schema. Falls back to page title if blank." }
      - { name: eventStartDate, label: "Event start date (YYYY-MM-DD)", type: string, required: false, description: "Optional. Emit SportsEvent schema with this start date." }
      - { name: eventEndDate,   label: "Event end date (YYYY-MM-DD)",   type: string, required: false, description: "Optional. Emit SportsEvent schema with this end date. Both start and end must be set for schema to emit." }
      - { name: body,         label: Content,               type: rich-text }

  - name: tournaments
    label: "Programs — Tournaments"
    type: collection
    path: site/src/programs/tournaments
    fields: *program-fields

  - name: register
    label: Registration
    type: collection
    path: site/src/register
    fields: *page-fields

  - name: schedules
    label: Schedules
    type: collection
    path: site/src/schedules
    fields: *page-fields

  - name: families
    label: Families
    type: collection
    path: site/src/families
    fields: *page-fields

  - name: coaches
    label: Coaches
    type: collection
    path: site/src/coaches
    fields: *page-fields

  - name: referees
    label: Referees
    type: collection
    path: site/src/referees
    fields: *page-fields

  - name: qa-answers
    label: "Ask the Referee — Q&As"
    type: collection
    path: site/src/referees/qa
    fields:
      - { name: question,      label: "Question",     type: string,
          description: "The full question as submitted." }
      - { name: category,      label: "Category",     type: string,
          description: "Enter one of: Goalkeeper Rules | Offside | Fouls & Misconduct | Restarts | Equipment & Player Safety | Age Group Rules (AYSO-Specific) | Officiating & Mechanics" }
      - { name: body,          label: "Answer",       type: rich-text }

  - name: managers
    label: "Team Managers"
    type: collection
    path: site/src/managers
    fields: *page-fields

  - name: volunteers
    label: Volunteers
    type: collection
    path: site/src/volunteers
    fields: *page-fields

  - name: fields
    label: "Field Locations"
    type: collection
    path: site/src/fields
    fields:
      - { name: title,           label: "Page Title",        type: string }
      - { name: description,     label: "Meta Description",  type: string }
      - { name: layout,          label: Layout,              type: string, hidden: true }
      - { name: section,         label: Section,             type: string, hidden: true }
      - { name: permalink,       label: Permalink,           type: string, hidden: true, required: false }
      - name: heroImage
        label: "Hero Image"
        type: image
        media: images
        required: false
      - { name: heroImageAlt,    label: "Hero Image Alt Text",  type: string, required: false }
      - { name: placeAddress,    label: "Street Address",       type: string, required: false, description: "E.g. '2575 Paloma St'. Used for Place schema." }
      - { name: placeLocality,   label: "City",                 type: string, required: false, description: "Pasadena, Altadena, or La Cañada Flintridge." }
      - { name: placePostalCode, label: "ZIP",                  type: string, required: false }
      - { name: parking,         label: "Parking",              type: text,   required: false, description: "1-2 sentences. Where to park, any restrictions. Optional." }
      - { name: restrooms,       label: "Restrooms",            type: string, required: false, description: "Where they are. Leave blank if none." }
      - { name: surface,         label: "Field surface",        type: string, required: false, description: "E.g. 'Grass' or 'Synthetic turf'. Optional." }
      - { name: lighting,        label: "Lighting",             type: string, required: false, description: "E.g. 'Yes, until 9pm' or 'No — daylight only'. Optional." }
      - { name: snackBar,        label: "Snack bar",            type: string, required: false, description: "Days/times available, or leave blank if none." }
      - { name: body,            label: Content,                type: rich-text }

  - name: resources
    label: Resources
    type: collection
    path: site/src/resources
    fields: *page-fields

  - name: contact
    label: Contact
    type: collection
    path: site/src/contact
    fields: *page-fields
