name = "ayso13-weather-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Cron triggers refresh every 5 min so the cached payload stays fresh
# regardless of page traffic.
[triggers]
crons = ["*/5 * * * *"]

# KV holds the most recent normalized JSON envelope under key "current".
[[kv_namespaces]]
binding = "WEATHER_KV"
id = "3a591305dddf4644903b97201292a989"

# Mount the Worker on the prod + staging domains at /api/weather.
# Same-origin so the browser fetch from /resources/weather/ doesn't
# need CORS on either environment.
[[routes]]
pattern = "www.ayso13.org/api/weather"
zone_name = "ayso13.org"

[[routes]]
pattern = "staging.ayso13.org/api/weather"
zone_name = "ayso13.org"

# Environment defaults — Victory Park, the primary 6U-12U game location,
# as the NWS forecast point (~4.4 km east of the old Pasadena City Hall point).
# Coordinates are Victory Park's placeLat/placeLon from site/src/fields/victory.md,
# truncated to 4 decimal places because api.weather.gov rejects higher precision
# with HTTP 301 "Adjusting Precision Of Point Coordinate". Four decimals resolve
# directly to the same gridpoint (LOX/161,49); the ~12 m difference is irrelevant
# against an NWS grid cell of roughly 2.5 km. The forecast-URL KV cache is keyed
# by lat/lon and re-resolves automatically on coordinate changes.
[vars]
FORECAST_LAT = "34.1594"
FORECAST_LON = "-118.0983"
USER_AGENT = "(ayso13.org weather page, info@ayso13.org)"
TEMPEST_STATION_ID = "33318"

# Slack notifications (see the "Slack notifications" section in src/index.js).
# NOTIFY_WEATHER_CHANNEL_ID: the #notify-weather channel id (starts with C).
#   Channel ids are not secret, so they live here. REPLACE the placeholder
#   with the real id once the channel exists and the bot has been invited.
# POP_FORECAST_THRESHOLD: rain heads-up fires when any forecast period in the
#   next ~72h has a probability of precipitation at or above this percent.
# SLACK_BOT_TOKEN is a SECRET, not a var — set it with:
#   npx wrangler secret put SLACK_BOT_TOKEN   (same xoxb token as the slack-bot)
NOTIFY_WEATHER_CHANNEL_ID = "C0BB7JJ0XRN"
POP_FORECAST_THRESHOLD = "60"

# Closure-notifier debounce (Slack #notify-weather only; the live weather page
# and /temp still show the true instantaneous WBGT/level). Stops the notice from
# flapping when WBGT hovers at the CIF Level 5 boundary. Heat hysteresis: the
# closure notice TRIPS at WBGT_TRIP_F (Level 5 = 89.7°F) and only CLEARS once
# WBGT falls to WBGT_CLEAR_F (a deadband wider than the ~±1°F WBGT noise). Any
# change (trip or clear) must also persist CLOSURE_DWELL_MINUTES before it posts,
# which filters transient one-tick spikes. Rain/AQI closures aren't hysteretic
# (they don't flap) but still respect the dwell.
WBGT_TRIP_F = "89.7"
WBGT_CLEAR_F = "88.0"
CLOSURE_DWELL_MINUTES = "15"
# NWS active-alert Slack notifier — opt-in, OFF by default (too noisy in
# #notify-weather). Set to "true" to resume new/ended-alert posts. The closure
# and rain-forecast notifiers are unaffected.
NWS_ALERTS_ENABLED = "false"

# PurpleAir AQI (primary AQI source; AirNow is the fallback). See
# docs/superpowers/specs/2026-06-21-purpleair-aqi-design.md.
# PURPLEAIR_SENSOR_IDS: CSV of curated OUTDOOR sensor indices near our fields.
# PURPLEAIR_READ_KEY is a SECRET — set with `npx wrangler secret put PURPLEAIR_READ_KEY`.
# Curated outdoor sensors (conf 100) spread across field clusters: Rose Bowl
# 80807, Victory Park 269172, Washington Park 268966, Altadena 174491,
# La Cañada (Fairview Dr) 46941. Median composite is robust to one offline.
PURPLEAIR_SENSOR_IDS = "80807,269172,268966,174491,46941"
PURPLEAIR_MIN_CONFIDENCE = "70"
PURPLEAIR_STALE_SECONDS = "3600"
# AQI is refreshed on this cadence (minutes), independent of the 5-min weather
# cron, to conserve PurpleAir API points. In-between cron ticks carry forward
# the last good reading; a failed/null reading is retried every tick.
AQI_REFRESH_MINUTES = "15"

