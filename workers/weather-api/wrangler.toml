name = "ayso13-weather-api"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Cron triggers refresh every 5 min so the cached payload stays fresh
# regardless of page traffic.
[triggers]
crons = ["*/5 * * * *"]

# KV holds the most recent normalized JSON envelope under key "current".
# Run once: wrangler kv:namespace create WEATHER_KV → paste the id below.
[[kv_namespaces]]
binding = "WEATHER_KV"
id = ""

# Mount the Worker on the prod domain at /api/weather. Same-origin so the
# browser fetch from /resources/weather/ doesn't need CORS.
[[routes]]
pattern = "www.ayso13.org/api/weather"
zone_name = "ayso13.org"

# Environment defaults — Pasadena City Hall as the NWS forecast point.
# Override with `wrangler deploy --var FORECAST_LAT=... FORECAST_LON=...`
# if Region 13 wants a primary-field-specific forecast.
[vars]
FORECAST_LAT = "34.1478"
FORECAST_LON = "-118.1445"
USER_AGENT = "(ayso13.org weather page, info@ayso13.org)"
