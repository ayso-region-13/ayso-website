name = "ayso13-field-maps"
main = "src/index.js"
compatibility_date = "2025-05-18"

# Dedicated hostname. Keeps the editor off the public site's CSP / routes
# and gives Cloudflare Access a clean application boundary.
#
# IMPORTANT: bind ONLY the custom domain. Do NOT enable the *.workers.dev
# route — that URL is not protected by the Access app on fields.ayso13.org,
# so leaving it on would let anyone bypass Access and hit /api/* (which holds
# a GitHub write token). The Worker also verifies the Access JWT on every
# request as defense-in-depth, but the workers.dev route should stay off.
workers_dev = false

[[routes]]
pattern = "fields.ayso13.org"
custom_domain = true

# Static editor assets (public/index.html, app.js, style.css), served via the
# ASSETS binding. run_worker_first = true makes the Worker fetch handler run
# for EVERY request — including asset requests — so it can (a) verify the
# Cloudflare Access JWT before serving anything and (b) attach the
# Mapbox-permissive CSP to the HTML response. The Worker calls
# env.ASSETS.fetch(request) to retrieve the static file once auth passes.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# ── Vars (non-secret config; safe to commit) ────────────────────────────────
[vars]
# Your Cloudflare Access team domain, e.g. "ayso13.cloudflareaccess.com".
# Find it under Zero Trust → Settings → Custom Pages / team domain.
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_TEAM_DOMAIN.cloudflareaccess.com"
# The Access application's AUD tag (Zero Trust → Access → Applications →
# the field-maps app → Overview → Application Audience (AUD) Tag).
ACCESS_AUD = "REPLACE_WITH_ACCESS_APPLICATION_AUD"
# Repo and branch the editor commits to. Staging only — never main.
GITHUB_REPO = "ayso-region-13/ayso-website"
GITHUB_BRANCH = "staging"
# Public, URL-restricted Mapbox token (pk....). Used client-side for GL tiles
# and the Static Images API. Restrict it to https://fields.ayso13.org/* in the
# Mapbox account. Served to the editor via GET /api/config. It is intentionally
# public — the Access gate is what limits who can load the editor.
MAPBOX_TOKEN_PUBLIC = "REPLACE_WITH_URL_RESTRICTED_PUBLIC_MAPBOX_TOKEN"

# ── Secrets (set with `wrangler secret put <NAME>`; never commit) ────────────
#   GITHUB_TOKEN - fine-grained PAT scoped to ayso-region-13/ayso-website with
#                  Contents: Read & Write. Used by the Git Data API commit flow.
#                  Create at github.com/settings/tokens?type=beta
