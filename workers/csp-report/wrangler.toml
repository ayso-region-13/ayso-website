name = "ayso13-csp-report"
main = "src/index.js"
compatibility_date = "2025-05-18"

# Mount on /api/csp-report on both prod + staging. The more-specific
# route here means it takes precedence over the redirect Worker's
# /* and won't try to fetch(request) for these POSTs.

[[routes]]
pattern = "www.ayso13.org/api/csp-report"
zone_name = "ayso13.org"

[[routes]]
pattern = "staging.ayso13.org/api/csp-report"
zone_name = "ayso13.org"

# KV for storing violation reports. 30-day TTL is set per-record in
# the Worker; KV auto-deletes expired entries.
#
# First-time setup:
#   wrangler kv namespace create CSP_REPORTS
#   Then paste the resulting id below.
[[kv_namespaces]]
binding = "CSP_REPORTS"
id = "PASTE_KV_NAMESPACE_ID_HERE"

# Required secret (set with `wrangler secret put ADMIN_KEY`):
#   ADMIN_KEY - random string used to gate GET /api/csp-report?admin_key=...
#               Generate with: openssl rand -hex 24
