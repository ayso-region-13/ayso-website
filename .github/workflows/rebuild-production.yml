name: Rebuild Production (no promote)

# Rebuilds `main` as-is and redeploys it to the ayso-website-prod Pages project.
# It does NOT merge staging → main, so it ships nothing new beyond what is
# already on main — only a fresh build. That matters because the field maps are
# fetched from the platform's public API AT BUILD TIME
# (site/src/_data/lib/fetchFieldMaps.js), so a map edited in the platform's
# fields editor only reaches www.ayso13.org when the site is rebuilt.
#
# WHY THIS EXISTS: the fields editor's "Publish Site" button used to POST a
# Cloudflare Pages deploy hook, which fired CF's own Git build. That build works,
# but it never touches GitHub Actions — and every Slack deploy notification in
# this repo is a workflow step, so a publish was completely silent. It also
# skipped the retry loop and the IndexNow ping that the promote path has. The
# button now fires `repository_dispatch` here instead, so a publish is reported
# in Slack with its real outcome and takes the same reliable Direct Upload path
# as every other deploy.
#
# ⚠️ `repository_dispatch` ONLY triggers a workflow when the workflow file is on
# the repository's DEFAULT branch, which here is `staging` (set so Pages CMS
# opens there). This file must stay on `staging` or the button silently does
# nothing — the dispatch API still answers 204. It checks out `main` explicitly
# for the same reason: the dispatched ref is the default branch, not main.
#
# Required repo secrets (all already present, used by the promote workflow):
#   SLACK_BOT_TOKEN                - Region 13 Slack app bot token
#   CLOUDFLARE_PAGES_DEPLOY_TOKEN  - token with Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID          - AYSO Region 13 account id

on:
  repository_dispatch:
    types: [fields-publish]
  workflow_dispatch:
  # The Slack bot writes field status and announcements to BOTH `staging` and
  # `main` (slack-bot/src/index.js, `commitToBothBranches`). That design is from
  # April 2026, when Cloudflare's own Git integration watched `main` and built it
  # automatically. The 2026-06-18 move to CI Direct Upload disabled CF
  # auto-deploy on both Pages projects and nothing replaced it on a push to
  # `main`, so from then until 2026-09-06 the bot's write to `main` was a no-op
  # for production: a rain closure posted from Slack went live on staging and
  # then sat invisible on www until somebody ran `/ayso promote` by hand.
  #
  # This trigger closes that gap. It is deliberately narrow — only the two files
  # the bot writes, NOT `site/**` — because every other route to production stays
  # deliberate. Ordinary content still reaches www only via a promote.
  #
  # Two things this depends on, both verified 2026-09-06:
  #   1. The bot commits through the Contents API with a fine-grained PAT, and a
  #      PAT-authored commit DOES fire push workflows. (Actions' own built-in
  #      GITHUB_TOKEN does not, to prevent recursion — that is not what the bot
  #      uses.) Proof: run 34041148674, event `push`, "Field status: Closed (via
  #      Slack — @pshopbell)", fired the staging deploy from exactly this path.
  #   2. ⚠️ A push trigger runs the copy of THIS FILE that is on the pushed
  #      branch — `main`. So this trigger is inert until it has been promoted to
  #      main, and the first Slack field update after it lands on staging still
  #      needs a manual `/ayso promote`. Same bootstrap wrinkle as the promote
  #      workflow's own `ref: main`.
  push:
    branches: [main]
    paths:
      - 'site/src/_data/fieldstatus.json'
      - 'site/src/_data/announcements.json'

permissions:
  contents: read

# Shared with promote-to-production.yml so a publish can never race a promote
# into the same Pages project. NOT cancel-in-progress: a second publish click
# should queue behind the first, not abandon a deploy that is already uploading.
concurrency:
  group: deploy-pages-prod
  cancel-in-progress: false

jobs:
  rebuild:
    name: Rebuild main, deploy to production
    runs-on: ubuntu-latest
    # A promote merges staging → main and deploys production itself, so the merge
    # commit it pushes must not fire a second, redundant prod deploy behind it.
    # Promote always merges `--no-ff --no-edit`, so its head commit is always
    # "Merge remote-tracking branch 'origin/staging'"; the bot writes
    # "Field status: …" / "Announcement updated …" and Pages CMS writes
    # "Update <path> (via Pages CMS)". Both ways this test can be wrong are
    # harmless: a missed skip costs one idempotent re-deploy, a wrong skip leaves
    # exactly the status quo that existed before this trigger. Evaluated as an
    # expression, never interpolated into a shell — see the Slack steps below for
    # how untrusted strings reach `run:`.
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'Merge ')
    timeout-minutes: 20
    steps:
      # A staging worker must never rebuild the PUBLIC site. The fields worker
      # already refuses to send `fields-publish` unless its own ENVIRONMENT is
      # production, and this is the matching assert on the receiving side, so a
      # misconfigured dispatcher fails VISIBLY here instead of silently shipping.
      # `workflow_dispatch` carries no client_payload, so empty is allowed.
      - name: Reject a non-production dispatch
        env:
          PAYLOAD_ENV: ${{ github.event.client_payload.environment }}
        run: |
          if [ -n "$PAYLOAD_ENV" ] && [ "$PAYLOAD_ENV" != "production" ]; then
            echo "::error::refusing a production rebuild dispatched with environment='$PAYLOAD_ENV'"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Resolve commit
        id: rev
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          # Read the subject from git rather than github.event.head_commit.message:
          # the same string, but it can never be an attacker-chosen payload field,
          # and `%s` is the first line only, so it cannot forge a second
          # key=value pair in $GITHUB_OUTPUT. Still sanitized again before Slack.
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      # `client_payload.actor` is supplied by whoever called the dispatch API, so
      # it is untrusted input. It reaches Slack only through env → `jq --arg`,
      # never interpolated into a shell string. Newlines are stripped and the
      # length capped so it cannot forge extra Slack lines (e.g. a fake "deploy
      # live") inside this message; the fields worker can only ever send a
      # validated email, but this workflow trusts no caller.
      #
      # ⚠️ Slack answers HTTP 200 with {"ok":false} for a bad token, bad channel
      # or invalid blocks, so `curl -sS` alone reports success while the message
      # silently never arrives — which is the exact failure this whole change set
      # exists to eliminate. Every notify step below checks `.ok`. It annotates
      # rather than exiting non-zero: a Slack outage must not make a successful
      # deploy report as failed.
      - name: Notify Slack — rebuilding
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SHA: ${{ steps.rev.outputs.sha_short }}
          ACTOR: ${{ github.event.client_payload.actor }}
          SUBJECT: ${{ steps.rev.outputs.subject }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          WHO=$(printf '%s' "$ACTOR" | tr -d '\n\r' | head -c 100)
          WHAT=$(printf '%s' "$SUBJECT" | tr -d '\n\r' | head -c 200)
          RESP=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -nc --arg sha "$SHA" --arg actor "$WHO" --arg what "$WHAT" --arg run "$RUN_URL" '{
              channel: "C0A024YGR9C",
              text: "Rebuilding production — \($sha)…",
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: ":hourglass_flowing_sand: *Rebuilding production* — building `\($sha)` and deploying to www.ayso13.org with the current field maps and site data. Slack will update when it is live (~2-3 min).\($actor | if . == "" then "" else "\nRequested by " + . end)" } },
                { type: "context", elements: [ { type: "mrkdwn", text: "\($what | if . == "" then "" else . + " · " end)<\($run)|View workflow run>" } ] }
              ]
            }')")
          printf '%s' "$RESP" | jq -e '.ok' >/dev/null \
            || echo "::error::Slack post failed: $(printf '%s' "$RESP" | jq -r '.error // "unparseable response"')"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Build
        id: build
        working-directory: site
        env:
          # Prod build: emit allow-all robots + sitemap (NOT the staging block).
          CF_PAGES_BRANCH: main
          # Field maps come from the platform's public API at build time. Prod
          # reads the platform's prod instance.
          FIELDS_API_BASE: https://fields.ayso13.org
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages (production) with retry
        id: deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "::group::wrangler pages deploy (attempt $attempt)"
            if npx --yes wrangler@4 pages deploy _site \
                 --project-name=ayso-website-prod --branch=main; then
              echo "::endgroup::"; echo "Deployed on attempt $attempt"; exit 0
            fi
            echo "::endgroup::"; echo "attempt $attempt failed; retrying in 20s"; sleep 20
          done
          echo "::error::wrangler pages deploy failed after 3 attempts"; exit 1

      - name: Ping IndexNow (best-effort)
        if: success()
        continue-on-error: true
        working-directory: site
        env:
          KEY: 61d4461c23b7dcda89290711860408d3
          HOST: www.ayso13.org
        run: |
          # Submit prod URLs to IndexNow (Bing/Yandex/etc.) straight from the
          # sitemap we just built. Best-effort: a search-ping hiccup must not
          # fail the rebuild.
          set -uo pipefail
          SITEMAP=_site/sitemap.xml
          if [ ! -f "$SITEMAP" ]; then echo "no sitemap built; skipping"; exit 0; fi
          URLS_JSON=$(grep -oE '<loc>[^<]+' "$SITEMAP" | sed 's|<loc>||' | jq -R . | jq -s .)
          COUNT=$(echo "$URLS_JSON" | jq 'length')
          echo "Submitting $COUNT URLs to IndexNow"
          if [ "$COUNT" -lt 1 ]; then echo "no <loc> entries; skipping"; exit 0; fi
          PAYLOAD=$(jq -n --arg host "$HOST" --arg key "$KEY" \
            --arg keyLocation "https://${HOST}/${KEY}.txt" --argjson urls "$URLS_JSON" \
            '{host:$host, key:$key, keyLocation:$keyLocation, urlList:$urls}')
          CODE=$(curl -sS -o /tmp/indexnow.body -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d "$PAYLOAD" https://api.indexnow.org/IndexNow)
          echo "IndexNow response: $CODE"; cat /tmp/indexnow.body 2>/dev/null || true

      - name: Notify Slack — rebuild live
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SHA: ${{ steps.rev.outputs.sha_short }}
          ACTOR: ${{ github.event.client_payload.actor }}
          SUBJECT: ${{ steps.rev.outputs.subject }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          WHO=$(printf '%s' "$ACTOR" | tr -d '\n\r' | head -c 100)
          WHAT=$(printf '%s' "$SUBJECT" | tr -d '\n\r' | head -c 200)
          RESP=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -nc --arg sha "$SHA" --arg actor "$WHO" --arg what "$WHAT" --arg run "$RUN_URL" '{
              channel: "C0A024YGR9C",
              text: "Production rebuild live — \($sha)",
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: ":white_check_mark: *Production rebuild live* — `\($sha)` is serving on www.ayso13.org with the current field maps and site data.\($actor | if . == "" then "" else "\nRequested by " + . end)" } },
                { type: "context", elements: [ { type: "mrkdwn", text: "\($what | if . == "" then "" else . + " · " end)<\($run)|View workflow run>" } ] }
              ]
            }')")
          printf '%s' "$RESP" | jq -e '.ok' >/dev/null \
            || echo "::error::Slack post failed: $(printf '%s' "$RESP" | jq -r '.error // "unparseable response"')"

      - name: Notify Slack — failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SHA: ${{ steps.rev.outputs.sha_short }}
          ACTOR: ${{ github.event.client_payload.actor }}
          SUBJECT: ${{ steps.rev.outputs.subject }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          WHO=$(printf '%s' "$ACTOR" | tr -d '\n\r' | head -c 100)
          WHAT=$(printf '%s' "$SUBJECT" | tr -d '\n\r' | head -c 200)
          # A push-triggered run is a field-status or announcement change from
          # Slack, not a map publish, so "click Publish Site again" would send the
          # reader to the wrong button at the worst possible moment.
          if [ "$EVENT" = "push" ]; then
            RETRY="Re-run this workflow from the Actions tab to retry."
          else
            RETRY="Click Publish Site again to retry."
          fi
          # An outcome is the EMPTY STRING for a step that never ran, which also
          # satisfies `!= "success"` — so check "never ran" FIRST, or a failed
          # checkout gets reported as a build failure with a blank SHA.
          if [ -z "$BUILD_OUTCOME" ]; then
            HEADLINE=":x: *Production rebuild failed before building*"
            REASON="Failed during checkout or setup, so nothing was built or deployed. www.ayso13.org is unchanged. Check the workflow logs."
          elif [ "$BUILD_OUTCOME" != "success" ]; then
            HEADLINE=":x: *Production rebuild failed*"
            REASON="The site build failed for \`$SHA\`. www.ayso13.org is still serving the previous version. Check the workflow logs."
          elif [ "$DEPLOY_OUTCOME" != "success" ]; then
            HEADLINE=":x: *Production rebuild failed*"
            REASON="Built, but the Cloudflare upload failed after 3 attempts for \`$SHA\`. www.ayso13.org is still serving the previous version. $RETRY"
          else
            HEADLINE=":x: *Production rebuild workflow failed*"
            REASON="Workflow failed for \`$SHA\`. See run logs."
          fi
          RESP=$(curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -nc --arg head "$HEADLINE" --arg reason "$REASON" --arg actor "$WHO" --arg what "$WHAT" --arg run "$RUN_URL" '{
              channel: "C0A024YGR9C",
              text: "Production rebuild notice",
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: "\($head) — \($reason)\($actor | if . == "" then "" else "\nRequested by " + . end)" } },
                { type: "context", elements: [ { type: "mrkdwn", text: "\($what | if . == "" then "" else . + " · " end)<\($run)|View workflow run for details>" } ] }
              ]
            }')")
          printf '%s' "$RESP" | jq -e '.ok' >/dev/null \
            || echo "::error::Slack post failed: $(printf '%s' "$RESP" | jq -r '.error // "unparseable response"')"
