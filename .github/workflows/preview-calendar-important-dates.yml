name: Preview calendar-important-dates (temporary)

# THROWAWAY: delete this file before merging calendar-important-dates.
#
# Builds this branch with the live calendar sync applied (the data file is
# synced in the runner, not committed) and uploads it as a Pages preview at
# calendar-important-dates.ayso-website-staging.pages.dev. Never touches
# staging.ayso13.org, the staging or main branches, or Slack. A push trigger
# runs the copy of this file on the pushed branch, so it works without being
# on the default branch.

on:
  push:
    branches: [calendar-important-dates]

permissions:
  contents: read

concurrency:
  group: preview-calendar-important-dates
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Sync and build
        working-directory: site
        env:
          CF_PAGES_BRANCH: staging
          FIELDS_API_BASE: https://fields.staging.ayso13.org
          ASK_API_BASE: https://referee.staging.ayso13.org
          ASK_TURNSTILE_SITE_KEY: 1x00000000000000000000BB
        run: |
          npm ci
          node scripts/sync-important-dates.mjs
          cat src/_data/importantDates.json
          npm run build

      - name: Upload preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: site
        run: |
          npx --yes wrangler@4 pages deploy _site \
            --project-name=ayso-website-staging --branch=calendar-important-dates
