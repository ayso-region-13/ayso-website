name: Promote Staging to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to confirm deployment to production'
        required: true
        default: ''

permissions:
  contents: write

# Promote = merge staging → main, then BUILD in CI and deploy to the
# ayso-website-prod Pages project via `wrangler pages deploy` (Direct Upload).
# This replaced the old "wait for CF Git build" model: CF's Git-integration
# pipeline was flaky (deploys stalled/failed in CF's initialize/deploy stages),
# so we build here and upload only changed files (hash-deduped), with retry.
# CF auto-deploy is DISABLED on ayso-website-prod, so CI is the sole deployer.
# (A CF Pages *deploy hook* was still an explicit exception to that — the fields
# editor's "Publish Site" button fired one, which built on CF and so reported
# nothing to Slack. That button now dispatches rebuild-production.yml instead.)
# No debounce here (unlike staging) — promotes are infrequent and deliberate.
# Triggered from Slack via `/ayso promote` (workflow_dispatch).

# Shared with rebuild-production.yml so a field-map "Publish Site" rebuild can
# never race a promote into the same Pages project. NOT cancel-in-progress — a
# promote that is already merging or uploading must run to completion.
#
# The group is conditional on the confirmation because `concurrency` is
# workflow-level and evaluated BEFORE the job's `if:`. A mistyped confirmation
# would otherwise enter the shared group, evict whatever was pending there, and
# then skip its own job — cancelling a real promote to do nothing. A run that
# will not promote gets a throwaway per-run group instead.
#
# ⚠️ GitHub keeps only ONE pending run per group and cancels the older one, so a
# queued promote CAN still be superseded by a later publish. A run cancelled
# before any job starts runs no steps, so nothing reports it — not even an
# `always()` step. If `/ayso promote` posts nothing to Slack within ~60s, it was
# superseded: just run it again. Accepted deliberately (2026-08-03) — correct
# production content matters more than promote-notification reliability, and a
# dropped publish is self-healing because the next prod build refetches the maps.
concurrency:
  group: ${{ github.event.inputs.confirm == 'promote' && 'deploy-pages-prod' || format('promote-noop-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  promote:
    name: Merge staging → main, build, deploy to production
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'promote'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge staging into main
        id: merge
        run: |
          git checkout main
          git pull origin main
          MAIN_BEFORE=$(git rev-parse HEAD)
          git merge origin/staging --no-edit --no-ff -X theirs
          git push origin main

          # Titles of the promoted commits (MAIN_BEFORE..HEAD, no merge commit),
          # capped at 10 for Slack with a "...and N more" footer.
          FULL=$(git log "$MAIN_BEFORE..HEAD" --no-merges --pretty=format:'%s')
          COUNT=$(printf '%s\n' "$FULL" | grep -c . || true)
          LIST=$(printf '%s\n' "$FULL" | head -10 | sed 's/^/• /')
          if [ "$COUNT" -gt 10 ]; then
            REMAINING=$((COUNT - 10))
            LIST="$(printf '%s\n• …and %s more' "$LIST" "$REMAINING")"
          fi
          if [ -z "$LIST" ]; then
            LIST="• (no new commits)"
            COUNT=0
          fi

          {
            echo "sha_short=$(git rev-parse --short HEAD)"
            echo "commit_count=$COUNT"
            echo "commits<<COMMITS_EOF"
            echo "$LIST"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack — merged, building & deploying
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SHA: ${{ steps.merge.outputs.sha_short }}
          COUNT: ${{ steps.merge.outputs.commit_count }}
          COMMITS: ${{ steps.merge.outputs.commits }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -nc --arg sha "$SHA" --arg run "$RUN_URL" --arg count "$COUNT" --arg commits "$COMMITS" '{
              channel: "C0A024YGR9C",
              text: "Promotion merged — building & deploying \($sha)…",
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: ":hourglass_flowing_sand: *Promotion merged* — building `\($sha)` (\($count) commits) in CI and deploying to production. Slack will update when it is live (~2-3 min)." } },
                { type: "section", text: { type: "mrkdwn", text: "*Promoting:*\n\($commits)" } },
                { type: "context", elements: [ { type: "mrkdwn", text: "<\($run)|View workflow run>" } ] }
              ]
            }')"

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Build
        id: build
        working-directory: site
        env:
          # Prod build: emit allow-all robots + sitemap (NOT the staging block).
          CF_PAGES_BRANCH: main
          # Field maps come from the platform's public API at build time. Prod
          # reads the platform's prod instance (Phase 3 cutover, 2026-07-24).
          FIELDS_API_BASE: https://fields.ayso13.org
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages (production) with retry
        id: deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "::group::wrangler pages deploy (attempt $attempt)"
            if npx --yes wrangler@4 pages deploy _site \
                 --project-name=ayso-website-prod --branch=main; then
              echo "::endgroup::"; echo "Deployed on attempt $attempt"; exit 0
            fi
            echo "::endgroup::"; echo "attempt $attempt failed; retrying in 20s"; sleep 20
          done
          echo "::error::wrangler pages deploy failed after 3 attempts"; exit 1

      - name: Ping IndexNow (best-effort)
        if: success()
        continue-on-error: true
        working-directory: site
        env:
          KEY: 61d4461c23b7dcda89290711860408d3
          HOST: www.ayso13.org
        run: |
          # Submit prod URLs to IndexNow (Bing/Yandex/etc.) straight from the
          # sitemap we just built — no CF-deploy wait or pages.dev WAF-bypass
          # fetch needed anymore. Best-effort: a search-ping hiccup must not
          # fail the promotion.
          set -uo pipefail
          SITEMAP=_site/sitemap.xml
          if [ ! -f "$SITEMAP" ]; then echo "no sitemap built; skipping"; exit 0; fi
          URLS_JSON=$(grep -oE '<loc>[^<]+' "$SITEMAP" | sed 's|<loc>||' | jq -R . | jq -s .)
          COUNT=$(echo "$URLS_JSON" | jq 'length')
          echo "Submitting $COUNT URLs to IndexNow"
          if [ "$COUNT" -lt 1 ]; then echo "no <loc> entries; skipping"; exit 0; fi
          PAYLOAD=$(jq -n --arg host "$HOST" --arg key "$KEY" \
            --arg keyLocation "https://${HOST}/${KEY}.txt" --argjson urls "$URLS_JSON" \
            '{host:$host, key:$key, keyLocation:$keyLocation, urlList:$urls}')
          CODE=$(curl -sS -o /tmp/indexnow.body -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d "$PAYLOAD" https://api.indexnow.org/IndexNow)
          echo "IndexNow response: $CODE"; cat /tmp/indexnow.body 2>/dev/null || true

      - name: Notify Slack — deploy live
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SHA: ${{ steps.merge.outputs.sha_short }}
          COUNT: ${{ steps.merge.outputs.commit_count }}
          COMMITS: ${{ steps.merge.outputs.commits }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -nc --arg sha "$SHA" --arg run "$RUN_URL" --arg count "$COUNT" --arg commits "$COMMITS" '{
              channel: "C0A024YGR9C",
              text: "Production deploy live — \($sha)",
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: ":white_check_mark: *Production deploy live* — `\($sha)` is now serving on www.ayso13.org." } },
                { type: "section", text: { type: "mrkdwn", text: "*Promoted (\($count) commits):*\n\($commits)" } },
                { type: "context", elements: [ { type: "mrkdwn", text: "<\($run)|View workflow run>" } ] }
              ]
            }')"

      - name: Notify Slack — failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SHA: ${{ steps.merge.outputs.sha_short }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          if [ "$MERGE_OUTCOME" != "success" ]; then
            HEADLINE=":x: *Promotion failed*"
            REASON="Merge from staging to main failed. Staging was NOT promoted."
          elif [ "$BUILD_OUTCOME" != "success" ]; then
            HEADLINE=":x: *Production build failed*"
            REASON="Merged to main, but the site build failed for \`$SHA\`. www.ayso13.org is still serving the previous version. Check the workflow logs."
          elif [ "$DEPLOY_OUTCOME" != "success" ]; then
            HEADLINE=":x: *Production deploy failed*"
            REASON="Merged + built, but the Cloudflare upload failed after 3 attempts for \`$SHA\`. www.ayso13.org is still serving the previous version — re-run \`/ayso promote\` to retry."
          else
            HEADLINE=":x: *Promotion workflow failed*"
            REASON="Workflow failed. See run logs."
          fi
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -nc --arg head "$HEADLINE" --arg reason "$REASON" --arg run "$RUN_URL" '{
              channel: "C0A024YGR9C",
              text: "Production promote notice",
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: "\($head) — \($reason)" } },
                { type: "context", elements: [ { type: "mrkdwn", text: "<\($run)|View workflow run for details>" } ] }
              ]
            }')"
