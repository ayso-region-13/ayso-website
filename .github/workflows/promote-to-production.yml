name: Promote Staging to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to confirm deployment to production'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  promote:
    name: Merge staging → main, wait for Cloudflare deploy
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'promote'
    # 28 min: covers the wait-for-cf-deploy budget (FIND_TIMEOUT 180s +
    # DEPLOY_TIMEOUT 1200s = ~23 min) plus merge/setup overhead.
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge staging into main
        id: merge
        run: |
          git checkout main
          git pull origin main
          MAIN_BEFORE=$(git rev-parse HEAD)
          git merge origin/staging --no-edit --no-ff -X theirs
          git push origin main

          # Extract titles of the commits being promoted (everything from
          # MAIN_BEFORE up to the merge commit, excluding the merge commit
          # itself via --no-merges). Capped at 10 lines for Slack; overflow
          # gets a "...and N more" footer.
          FULL=$(git log "$MAIN_BEFORE..HEAD" --no-merges --pretty=format:'%s')
          COUNT=$(printf '%s\n' "$FULL" | grep -c . || true)
          LIST=$(printf '%s\n' "$FULL" | head -10 | sed 's/^/• /')
          if [ "$COUNT" -gt 10 ]; then
            REMAINING=$((COUNT - 10))
            LIST="$(printf '%s\n• …and %s more' "$LIST" "$REMAINING")"
          fi
          if [ -z "$LIST" ]; then
            LIST="• (no new commits)"
            COUNT=0
          fi

          {
            echo "sha_short=$(git rev-parse --short HEAD)"
            echo "sha_full=$(git rev-parse HEAD)"
            echo "commit_count=$COUNT"
            echo "commits<<COMMITS_EOF"
            echo "$LIST"
            echo "COMMITS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack — promotion merged, awaiting Cloudflare deploy
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SHA: ${{ steps.merge.outputs.sha_short }}
          COUNT: ${{ steps.merge.outputs.commit_count }}
          COMMITS: ${{ steps.merge.outputs.commits }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -nc \
              --arg sha "$SHA" \
              --arg run "$RUN_URL" \
              --arg count "$COUNT" \
              --arg commits "$COMMITS" '{
              channel: "C0A024YGR9C",
              text: "Promotion merged — Cloudflare deploying \($sha)…",
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: ":hourglass_flowing_sand: *Promotion merged* — Cloudflare is now building `\($sha)` (\($count) commits). Slack will update when the deploy is live (~2 min)." } },
                { type: "section", text: { type: "mrkdwn", text: "*Promoting:*\n\($commits)" } },
                { type: "context", elements: [ { type: "mrkdwn", text: "<\($run)|View workflow run>" } ] }
              ]
            }')"

      - name: Wait for Cloudflare Pages deploy
        id: cf_wait
        env:
          CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ayso-website-prod
          SHA: ${{ steps.merge.outputs.sha_full }}
        run: bash .github/scripts/wait-for-cf-deploy.sh

      - name: Notify Slack — deploy live
        if: success()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SHA: ${{ steps.merge.outputs.sha_short }}
          COUNT: ${{ steps.merge.outputs.commit_count }}
          COMMITS: ${{ steps.merge.outputs.commits }}
          BUILD_SECONDS: ${{ steps.cf_wait.outputs.build_seconds }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -nc \
              --arg sha "$SHA" \
              --arg secs "$BUILD_SECONDS" \
              --arg run "$RUN_URL" \
              --arg count "$COUNT" \
              --arg commits "$COMMITS" '{
              channel: "C0A024YGR9C",
              text: "Production deploy live — \($sha)",
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: ":white_check_mark: *Production deploy live* — `\($sha)` is now serving on www.ayso13.org. Build took \($secs)s." } },
                { type: "section", text: { type: "mrkdwn", text: "*Promoted (\($count) commits):*\n\($commits)" } },
                { type: "context", elements: [ { type: "mrkdwn", text: "<\($run)|View workflow run>" } ] }
              ]
            }')"

      - name: Notify Slack — failure
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SHA: ${{ steps.merge.outputs.sha_short }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MERGE_OUTCOME: ${{ steps.merge.outcome }}
          CF_OUTCOME: ${{ steps.cf_wait.outcome }}
          CF_STATUS: ${{ steps.cf_wait.outputs.final_status }}
        run: |
          # Distinguish three cases so the Slack message is actionable and
          # not a false alarm:
          #   - merge failed            -> hard failure, nothing promoted
          #   - CF reported a real fail -> hard failure, build broke
          #   - CF wait timed out       -> SOFT: CF Pages was just slow to
          #     leave the queue; the build very likely finishes on its own.
          if [ "$MERGE_OUTCOME" != "success" ]; then
            HEADLINE=":x: *Promotion failed*"
            REASON="Merge from staging to main failed. Staging was NOT promoted."
          elif [ "$CF_STATUS" = "timeout" ]; then
            HEADLINE=":hourglass_flowing_sand: *Production deploy still in progress*"
            REASON="Merge to main succeeded, but Cloudflare Pages was still building \`$SHA\` when the wait window elapsed (CF queue is slow during busy periods). The build most likely completes on its own — check www.ayso13.org and the CF Pages dashboard before treating this as a failure."
          elif [ "$CF_OUTCOME" != "success" ]; then
            HEADLINE=":x: *Production deploy failed*"
            REASON="Merge succeeded but the Cloudflare Pages build FAILED for \`$SHA\`. Site is still serving the previous version. Check the CF Pages build log."
          else
            HEADLINE=":x: *Promotion workflow failed*"
            REASON="Workflow failed. See run logs."
          fi
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -nc --arg head "$HEADLINE" --arg reason "$REASON" --arg run "$RUN_URL" '{
              channel: "C0A024YGR9C",
              text: "Production promote notice",
              blocks: [
                { type: "section", text: { type: "mrkdwn", text: "\($head) — \($reason)" } },
                { type: "context", elements: [ { type: "mrkdwn", text: "<\($run)|View workflow run for details>" } ] }
              ]
            }')"
