name: Promote Staging to Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "promote" to confirm deployment to production'
        required: true
        default: ''

permissions:
  contents: write

jobs:
  promote:
    name: Merge staging → main
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'promote'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN }}

      - name: Verify token identity
        env:
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          echo "Token authenticates as:"
          gh api user --jq '.login'
          echo "Token can bypass ruleset?"
          gh api repos/${{ github.repository }}/rulesets --jq '.[].current_user_can_bypass'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge staging into main
        run: |
          git checkout main
          git pull origin main
          git merge origin/staging --no-edit --no-ff -X theirs
          git push origin main
