name: Deploy Redirect Worker

# Auto-deploys the ayso13-redirects Cloudflare Worker on pushes to
# main (-> production env, www.ayso13.org) or staging (-> staging
# env, staging.ayso13.org). The Worker uses Workers environments
# so prod and staging are separate deployments sharing the same
# source code + generated map.js.
#
# Trigger paths:
#   - site/src/_redirects        (the source-of-truth file)
#   - workers/redirects/**       (Worker code, map, scripts)
#   - this workflow file
#
# Manual dispatch is also supported (will deploy whichever branch
# the workflow is dispatched on -- defaults to main).
#
# Required repo secrets:
#   CLOUDFLARE_API_TOKEN  - Cloudflare API token with permissions:
#                            Account -> Workers Scripts -> Edit
#                            Account -> Account Settings -> Read
#   CLOUDFLARE_ACCOUNT_ID - AYSO Region 13 account ID.

on:
  push:
    branches: [main, staging]
    paths:
      - 'site/src/_redirects'
      - 'workers/redirects/**'
      - '.github/workflows/deploy-redirects-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'workers/redirects/package-lock.json'

      - name: Install
        working-directory: workers/redirects
        run: npm ci

      - name: Deploy (branch-scoped env)
        working-directory: workers/redirects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "Branch = main -> deploying to production (www.ayso13.org)"
            npm run deploy:prod
          elif [ "${{ github.ref_name }}" = "staging" ]; then
            echo "Branch = staging -> deploying to staging (staging.ayso13.org)"
            npm run deploy:staging
          else
            echo "::error::Unsupported branch ${{ github.ref_name }} -- not deploying"
            exit 1
          fi
