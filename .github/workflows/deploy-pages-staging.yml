name: Deploy Staging (Pages Direct Upload)

# Builds the Eleventy site in CI and deploys it to the ayso-website-staging
# Cloudflare Pages project via `wrangler pages deploy` (Direct Upload).
#
# WHY: CF Pages' Git-integration build pipeline was flaky — deploys stalled
# and failed in CF's `initialize`/`deploy` stages (not our build). Direct
# Upload removes those stages: CI builds, then wrangler uploads only the
# changed files (hash-deduped manifest) and reports success via exit code.
#
# CUTOVER: while CF's Git auto-deploy is still active this is dispatch-only
# (to avoid double-building). Once automatic deployments are DISABLED on the
# ayso-website-staging project (Pages → Settings → Builds & deployments),
# uncomment the `push` trigger so CMS commits to `staging` auto-deploy here.
#
# Required repo secrets:
#   CLOUDFLARE_PAGES_DEPLOY_TOKEN  - token with Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID          - AYSO Region 13 account id

on:
  workflow_dispatch:
  # push:
  #   branches: [staging]
  #   paths:
  #     - 'site/**'
  #     - '.github/workflows/deploy-pages-staging.yml'

permissions:
  contents: read

concurrency:
  group: deploy-pages-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      # Cache the eleventy-img output so we don't re-encode every image each run.
      - name: Cache image pipeline
        uses: actions/cache@v4
        with:
          path: site/.cache
          key: eleventy-img-${{ hashFiles('site/src/images/**') }}
          restore-keys: eleventy-img-

      - name: Build
        working-directory: site
        env:
          # CF Git builds auto-set this; in CI we must set it so robots.njk /
          # _headers.njk emit the staging crawl-block (Disallow + noindex).
          CF_PAGES_BRANCH: staging
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages (staging) with retry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: site
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "::group::wrangler pages deploy (attempt $attempt)"
            if npx --yes wrangler@4 pages deploy _site \
                 --project-name=ayso-website-staging --branch=staging; then
              echo "::endgroup::"; echo "Deployed on attempt $attempt"; exit 0
            fi
            echo "::endgroup::"; echo "attempt $attempt failed; retrying in 20s"; sleep 20
          done
          echo "::error::wrangler pages deploy failed after 3 attempts"; exit 1
