name: IndexNow URL submission (manual)

# Pings api.indexnow.org with every URL in the production sitemap. IndexNow is
# a free protocol supported by Bing, Yandex, Naver, and Seznam.
#
# NORMAL PATH: the promote-to-production workflow now submits IndexNow itself
# as a final step (straight from the sitemap it builds). This standalone
# workflow is a MANUAL fallback (workflow_dispatch) for re-submitting URLs
# without a full promote — it builds the site and submits from the local
# sitemap, so it needs no CF-deploy wait. (The old push:[main] trigger +
# wait-for-cf-deploy were removed when prod moved to CI Direct Upload — CF
# Git auto-deploy is off, so there's no Git build to wait for.)
#
# Key ownership verified via /61d4461c23b7dcda89290711860408d3.txt at the apex.

on:
  workflow_dispatch:

concurrency:
  group: indexnow
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit:
    name: Build + submit sitemap URLs to IndexNow
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Build
        working-directory: site
        env:
          CF_PAGES_BRANCH: main
        run: |
          npm ci
          npm run build

      - name: Submit URLs to IndexNow
        working-directory: site
        env:
          KEY: 61d4461c23b7dcda89290711860408d3
          HOST: www.ayso13.org
        run: |
          set -uo pipefail
          SITEMAP=_site/sitemap.xml
          if [ ! -f "$SITEMAP" ]; then echo "::error::no sitemap built"; exit 1; fi
          URLS_JSON=$(grep -oE '<loc>[^<]+' "$SITEMAP" | sed 's|<loc>||' | jq -R . | jq -s .)
          COUNT=$(echo "$URLS_JSON" | jq 'length')
          echo "Sitemap parsed: $COUNT URLs"
          if [ "$COUNT" -lt 1 ]; then echo "::error::no <loc> entries"; exit 1; fi
          PAYLOAD=$(jq -n --arg host "$HOST" --arg key "$KEY" \
            --arg keyLocation "https://${HOST}/${KEY}.txt" --argjson urls "$URLS_JSON" \
            '{host:$host, key:$key, keyLocation:$keyLocation, urlList:$urls}')
          CODE=$(curl -sS -o /tmp/indexnow.body -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d "$PAYLOAD" https://api.indexnow.org/IndexNow)
          echo "IndexNow response: $CODE"; cat /tmp/indexnow.body 2>/dev/null || true
          [ "$CODE" = "200" ] || [ "$CODE" = "202" ]
